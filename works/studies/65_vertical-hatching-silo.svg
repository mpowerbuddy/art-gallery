<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 65: Vertical Hatching</text>
  
  <!-- Subject: Old wooden windmill/silo -->
  <g filter="url(#grain)">
    <!-- Sky -->
    <rect x="0" y="0" width="400" height="200" fill="#e5e0d5"/>
    
    <!-- Distant hills -->
    <path d="M0 190 Q100 170 200 185 Q300 200 400 180 L400 220 L0 220 Z" fill="#d5d0c5"/>
    
    <!-- Ground -->
    <path d="M0 220 Q150 230 250 220 Q350 210 400 225 L400 420 L0 420 Z" fill="#e0d8c8"/>
    
    <!-- Silo/mill body - cylindrical tower -->
    <rect x="140" y="120" width="120" height="300" fill="#d0c5b5"/>
    
    <!-- Vertical hatching for wooden plank texture -->
    <g stroke="#1a3a5c" stroke-width="1.2" stroke-linecap="round">
      <!-- Left side (shadow) - dense -->
      <line x1="148" y1="130" x2="148" y2="175"/>
      <line x1="148" y1="190" x2="148" y2="250"/>
      <line x1="148" y1="265" x2="148" y2="330"/>
      <line x1="148" y1="345" x2="148" y2="410"/>
      
      <line x1="156" y1="130" x2="156" y2="170"/>
      <line x1="156" y1="185" x2="156" y2="245"/>
      <line x1="156" y1="260" x2="156" y2="320"/>
      <line x1="156" y1="335" x2="156" y2="400"/>
      <line x1="156" y1="410" x2="156" y2="415"/>
      
      <!-- Mid section -->
      <line x1="164" y1="130" x2="164" y2="165"/>
      <line x1="164" y1="180" x2="164" y2="240"/>
      <line x1="164" y1="255" x2="164" y2="315"/>
      <line x1="164" y1="330" x2="164" y2="390"/>
      <line x1="164" y1="405" x2="164" y2="415"/>
      
      <line x1="172" y1="130" x2="172" y2="160"/>
      <line x1="172" y1="175" x2="172" y2="235"/>
      <line x1="172" y1="250" x2="172" y2="310"/>
      <line x1="172" y1="325" x2="172" y2="385"/>
      <line x1="172" y1="400" x2="172" y2="415"/>
      
      <!-- Center -->
      <line x1="180" y1="130" x2="180" y2="155"/>
      <line x1="180" y1="170" x2="180" y2="230"/>
      <line x1="180" y1="245" x2="180" y2="305"/>
      <line x1="180" y1="320" x2="180" y2="380"/>
      <line x1="180" y1="395" x2="180" y2="415"/>
      
      <line x1="188" y1="130" x2="188" y2="150"/>
      <line x1="188" y1="165" x2="188" y2="225"/>
      <line x1="188" y1="240" x2="188" y2="300"/>
      <line x1="188" y1="315" x2="188" y2="375"/>
      <line x1="188" y1="390" x2="188" y2="415"/>
      
      <!-- Right side (lighter) - sparser -->
      <g stroke-width="0.8" opacity="0.6">
        <line x1="196" y1="135" x2="196" y2="170"/>
        <line x1="196" y1="185" x2="196" y2="245"/>
        <line x1="196" y1="260" x2="196" y2="320"/>
        <line x1="196" y1="335" x2="196" y2="395"/>
        <line x1="196" y1="408" x2="196" y2="415"/>
        
        <line x1="204" y1="135" x2="204" y2="175"/>
        <line x1="204" y1="190" x2="204" y2="255"/>
        <line x1="204" y1="270" x2="204" y2="330"/>
        <line x1="204" y1="345" x2="204" y2="400"/>
        
        <line x1="212" y1="140" x2="212" y2="180"/>
        <line x1="212" y1="195" x2="212" y2="265"/>
        <line x1="212" y1="280" x2="212" y2="340"/>
        <line x1="212" y1="355" x2="212" y2="405"/>
        
        <line x1="220" y1="140" x2="220" y2="185"/>
        <line x1="220" y1="200" x2="220" y2="275"/>
        <line x1="220" y1="290" x2="220" y2="350"/>
        <line x1="220" y1="365" x2="220" y2="410"/>
        
        <line x1="228" y1="145" x2="228" y2="190"/>
        <line x1="228" y1="205" x2="228" y2="285"/>
        <line x1="228" y1="300" x2="228" y2="360"/>
        <line x1="228" y1="375" x2="228" y2="415"/>
        
        <line x1="236" y1="150" x2="236" y2="200"/>
        <line x1="236" y1="215" x2="236" y2="295"/>
        <line x1="236" y1="310" x2="236" y2="370"/>
        <line x1="236" y1="385" x2="236" y2="415"/>
        
        <line x1="244" y1="155" x2="244" y2="210"/>
        <line x1="244" y1="225" x2="244" y2="305"/>
        <line x1="244" y1="320" x2="244" y2="380"/>
        <line x1="244" y1="395" x2="244" y2="415"/>
        
        <line x1="252" y1="160" x2="252" y2="220"/>
        <line x1="252" y1="235" x2="252" y2="315"/>
        <line x1="252" y1="330" x2="252" y2="390"/>
        <line x1="252" y1="405" x2="252" y2="415"/>
      </g>
    </g>
    
    <!-- Horizontal wood grain accents -->
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round" opacity="0.4">
      <path d="M140 200 Q200 195 260 200" fill="none"/>
      <path d="M140 280 Q200 275 260 280" fill="none"/>
      <path d="M140 360 Q200 355 260 360" fill="none"/>
    </g>
    
    <!-- Roof cap -->
    <path d="M130 120 L200 70 L270 120 Z" fill="#b8a890"/>
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="160" y1="105" x2="160" y2="120"/>
      <line x1="180" y1="90" x2="180" y2="120"/>
      <line x1="200" y1="80" x2="200" y2="120"/>
      <line x1="220" y1="90" x2="220" y2="120"/>
      <line x1="240" y1="105" x2="240" y2="120"/>
    </g>
    
    <!-- Door at base -->
    <rect x="175" y="340" width="50" height="80" fill="#a89070"/>
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <line x1="182" y1="350" x2="182" y2="415"/>
      <line x1="190" y1="350" x2="190" y2="415"/>
      <line x1="198" y1="350" x2="198" y2="415"/>
      <line x1="206" y1="350" x2="206" y2="415"/>
      <line x1="214" y1="350" x2="214" y2="415"/>
      <line x1="222" y1="350" x2="222" y2="415"/>
      <!-- Door frame -->
      <rect x="175" y="340" width="50" height="80" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.3">
    <line x1="30" y1="430" x2="33" y2="465"/>
    <line x1="60" y1="435" x2="63" y2="475"/>
    <line x1="90" y1="428" x2="93" y2="460"/>
    <line x1="120" y1="432" x2="123" y2="468"/>
    <line x1="150" y1="430" x2="153" y2="462"/>
    <line x1="180" y1="428" x2="183" y2="455"/>
    <line x1="210" y1="435" x2="213" y2="472"/>
    <line x1="240" y1="430" x2="243" y2="460"/>
    <line x1="270" y1="432" x2="273" y2="465"/>
    <line x1="300" y1="428" x2="303" y2="458"/>
    <line x1="330" y1="435" x2="333" y2="475"/>
    <line x1="360" y1="430" x2="363" y2="462"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · wooden silo · contour breaks</text>
</svg>