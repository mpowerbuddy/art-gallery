<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Value blocks - no texture, just flat tones -->
    <linearGradient id="form-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf8f5"/>
      <stop offset="40%" stop-color="#d4cfc4"/>
      <stop offset="100%" stop-color="#8b8070"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#faf8f5"/>
  
  <!-- Form study - three geometric volumes -->
  
  <!-- Sphere -->
  <g transform="translate(120, 200)">
    <circle cx="0" cy="0" r="70" fill="url(#form-gradient)" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Highlight -->
    <ellipse cx="-25" cy="-25" rx="20" ry="12" fill="#faf8f5" opacity="0.7"/>
    <!-- Midtone boundary suggestion -->
    <ellipse cx="0" cy="0" rx="50" ry="50" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Cube -->
  <g transform="translate(280, 180)">
    <!-- Front face -->
    <rect x="-50" y="-50" width="100" height="100" fill="#d4cfc4" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Top face -->
    <path d="M-50,-50 L-20,-70 L80,-70 L50,-50 Z" fill="#faf8f5" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Side face -->
    <path d="M50,-50 L80,-70 L80,30 L50,50 Z" fill="#8b8070" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Edge highlights -->
    <line x1="-20" y1="-70" x2="80" y2="-70" stroke="#1a1a2e" stroke-width="0.5" opacity="0.5"/>
    <line x1="80" y1="-70" x2="80" y2="30" stroke="#1a1a2e" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- Cylinder -->
  <g transform="translate(380, 220)">
    <ellipse cx="0" cy="-50" rx="40" ry="15" fill="#faf8f5" stroke="#1a1a2e" stroke-width="1.5"/>
    <rect x="-40" y="-50" width="80" height="100" fill="url(#form-gradient)" stroke="#1a1a2e" stroke-width="1.5"/>
    <ellipse cx="0" cy="50" rx="40" ry="15" fill="#8b8070" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Cylinder highlight -->
    <line x1="-20" y1="-45" x2="-20" y2="45" stroke="#faf8f5" stroke-width="8" opacity="0.3"/>
  </g>
  
  <!-- Ground line -->
  <line x1="50" y1="320" x2="450" y2="320" stroke="#1a1a2e" stroke-width="1"/>
  
  <!-- Shadow suggestions -->
  <g fill="#8b8070" opacity="0.2">
    <ellipse cx="120" cy="290" rx="60" ry="12"/>
    <ellipse cx="280" cy="300" rx="55" ry="10"/>
    <ellipse cx="380" cy="290" rx="45" ry="10"/>
  </g>
  
  <!-- Title -->
  <text x="250" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1a1a2e" opacity="0.5">Form Studies</text>
</svg>