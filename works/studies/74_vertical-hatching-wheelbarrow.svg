<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 74: Vertical Hatching</text>
  
  <!-- Subject: Old wooden wheelbarrow -->
  <g filter="url(#grain)">
    <!-- Ground -->
    <path d="M0 420 Q100 410 200 420 Q300 430 400 415 L400 500 L0 500 Z" fill="#e0d8c8"/>
    
    <!-- Wheel -->
    <circle cx="100" cy="400" r="45" fill="#a89070"/>
    <circle cx="100" cy="400" r="40" fill="none" stroke="#1a3a5c" stroke-width="2"/>
    
    <!-- Wheel vertical hatching -->
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="100" y1="365" x2="100" y2="375"/>
      <line x1="100" y1="425" x2="100" y2="435"/>
      <line x1="65" y1="400" x2="72" y2="400"/>
      <line x1="128" y1="400" x2="135" y2="400"/>
      <line x1="75" y1="372" x2="80" y2="378"/>
      <line x1="120" y1="422" x2="125" y2="428"/>
      <line x1="75" y1="428" x2="80" y2="422"/>
      <line x1="120" y1="378" x2="125" y2="372"/>
    </g>
    <!-- Wheel hub -->
    <circle cx="100" cy="400" r="10" fill="#8a7a60"/>
    <circle cx="100" cy="400" r="5" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    
    <!-- Wheelbarrow tray -->
    <path d="M120 300 L280 280 L320 380 L140 400 Z" fill="#c8b898"/>
    
    <!-- Tray vertical hatching -->
    <g stroke="#1a3a5c" stroke-width="0.9" stroke-linecap="round">
      <!-- Left side -->
      <line x1="130" y1="305" x2="130" y2="340"/>
      <line x1="130" y1="350" x2="130" y2="390"/>
      
      <line x1="140" y1="302" x2="140" y2="335"/>
      <line x1="140" y1="345" x2="140" y2="395"/>
      
      <line x1="150" y1="298" x2="150" y2="330"/>
      <line x1="150" y1="340" x2="150" y2="395"/>
      
      <line x1="160" y1="295" x2="160" y2="325"/>
      <line x1="160" y1="335" x2="160" y2="395"/>
      
      <line x1="170" y1="292" x2="170" y2="320"/>
      <line x1="170" y1="330" x2="170" y2="395"/>
      
      <line x1="180" y1="290" x2="180" y2="315"/>
      <line x1="180" y1="325" x2="180" y2="395"/>
      
      <line x1="190" y1="288" x2="190" y2="310"/>
      <line x1="190" y1="320" x2="190" y2="395"/>
      
      <line x1="200" y1="286" x2="200" y2="305"/>
      <line x1="200" y1="315" x2="200" y2="395"/>
      
      <line x1="210" y1="285" x2="210" y2="302"/>
      <line x1="210" y1="312" x2="210" y2="395"/>
      
      <line x1="220" y1="284" x2="220" y2="300"/>
      <line x1="220" y1="310" x2="220" y2="395"/>
      
      <line x1="230" y1="283" x2="230" y2="298"/>
      <line x1="230" y1="308" x2="230" y2="395"/>
      
      <line x1="240" y1="282" x2="240" y2="296"/>
      <line x1="240" y1="306" x2="240" y2="395"/>
      
      <line x1="250" y1="281" x2="250" y2="295"/>
      <line x1="250" y1="305" x2="250" y2="395"/>
      
      <line x1="260" y1="280" x2="260" y2="294"/>
      <line x1="260" y1="304" x2="260" y2="395"/>
      
      <line x1="270" y1="280" x2="270" y2="293"/>
      <line x1="270" y1="303" x2="270" y2="395"/>
      
      <line x1="280" y1="280" x2="280" y2="292"/>
      <line x1="280" y1="302" x2="280" y2="392"/>
      
      <line x1="290" y1="285" x2="290" y2="295"/>
      <line x1="290" y1="305" x2="290" y2="385"/>
      
      <line x1="300" y1="295" x2="300" y2="310"/>
      <line x1="300" y1="320" x2="300" y2="375"/>
    </g>
    
    <!-- Legs -->
    <!-- Front leg -->
    <path d="M290 380 L310 420 L320 420 L300 380" fill="#b8a890"/>
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="300" y1="385" x2="300" y2="415"/>
      <line x1="308" y1="388" x2="308" y2="418"/>
      <line x1="316" y1="392" x2="316" y2="420"/>
    </g>
    
    <!-- Rear leg/handle -->
    <path d="M140 390 L80 420 L90 420 L150 395" fill="#b8a890"/>
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="130" y1="395" x2="130" y2="418"/>
      <line x1="115" y1="402" x2="115" y2="420"/>
      <line x1="100" y1="408" x2="100" y2="420"/>
    </g>
    
    <!-- Handle grip -->
    <rect x="70" y="415" width="30" height="8" rx="2" fill="#8a7a60"/>
    <g stroke="#1a3a5c" stroke-width="0.5" stroke-linecap="round">
      <line x1="75" y1="417" x2="75" y2="421"/>
      <line x1="85" y1="417" x2="85" y2="421"/>
      <line x1="95" y1="417" x2="95" y2="421"/>
    </g>
    
    <!-- Axle connection -->
    <rect x="85" y="395" width="20" height="10" fill="#6a5a40"/>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.25">
    <line x1="150" y1="435" x2="153" y2="465"/>
    <line x1="190" y1="440" x2="193" y2="475"/>
    <line x1="230" y1="432" x2="233" y2="462"/>
    <line x1="270" y1="438" x2="273" y2="470"/>
    <line x1="310" y1="435" x2="313" y2="465"/>
    <line x1="350" y1="440" x2="353" y2="472"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · wheelbarrow · contour breaks</text>
</svg>