<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Stippling pattern -->
    <pattern id="stipple-light" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="4" cy="4" r="0.8" fill="#1a1a2e" opacity="0.2"/>
    </pattern>
    <pattern id="stipple-medium" patternUnits="userSpaceOnUse" width="5" height="5">
      <circle cx="2.5" cy="2.5" r="1" fill="#1a1a2e" opacity="0.5"/>
    </pattern>
    <pattern id="stipple-dense" patternUnits="userSpaceOnUse" width="3" height="3">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1a1a2e" opacity="0.85"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f3ef"/>
  
  <!-- Organic stone/boulder form -->
  <g transform="translate(200, 230)">
    <!-- Outer shape - light stipple -->
    <path d="M-90,-80 Q-100,-30 -80,20 Q-95,70 -70,110 Q-30,100 10,60 Q40,100 80,90 Q110,50 90,-10 Q110,-60 70,-90 Q20,-100 -30,-80 Q-60,-85 -90,-80 Z" 
          fill="url(#stipple-light)" stroke="#1a1a2e" stroke-width="1"/>
    
    <!-- Middle form - medium stipple -->
    <path d="M-55,-55 Q-65,-20 -50,15 Q-60,50 -40,80 Q-15,65 15,40 Q40,65 55,50 Q75,20 55,-15 Q70,-45 45,-65 Q10,-70 -20,-55 Q-35,-55 -55,-55 Z" 
          fill="url(#stipple-medium)" stroke="#1a1a2e" stroke-width="1"/>
    
    <!-- Core - dense stipple -->
    <path d="M-25,-30 Q-35,-5 -20,15 Q-30,35 -15,50 Q0,35 15,20 Q30,35 25,10 Q35,-15 15,-30 Q-5,-35 -25,-30 Z" 
          fill="url(#stipple-dense)"/>
    
    <!-- Highlight area - no texture -->
    <ellipse cx="5" cy="-5" rx="10" ry="12" fill="none" stroke="#1a1a2e" stroke-width="0.6" opacity="0.4"/>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="400" rx="100" ry="20" fill="url(#stipple-light)" opacity="0.4"/>
  
  <!-- Individual stipple texture strokes -->
  <g fill="#1a1a2e" opacity="0.3">
    <circle cx="100" cy="180" r="1"/>
    <circle cx="110" cy="190" r="0.8"/>
    <circle cx="95" cy="195" r="1.2"/>
    <circle cx="105" cy="200" r="0.6"/>
    <circle cx="115" cy="185" r="1"/>
    
    <circle cx="290" cy="170" r="1"/>
    <circle cx="300" cy="180" r="0.8"/>
    <circle cx="295" cy="190" r="1.1"/>
    <circle cx="285" cy="185" r="0.7"/>
  </g>
  
  <!-- Signature -->
  <line x1="330" y1="470" x2="380" y2="470" stroke="#1a1a2e" stroke-width="0.8" opacity="0.4"/>
</svg>