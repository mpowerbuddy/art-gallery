<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hatching patterns -->
    <pattern id="hatch-light" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1a1a2e" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="hatch-medium" patternUnits="userSpaceOnUse" width="3" height="3">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#1a1a2e" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <pattern id="hatch-dense" patternUnits="userSpaceOnUse" width="2" height="2">
      <line x1="0" y1="0" x2="0" y2="2" stroke="#1a1a2e1.2"" stroke-width=" opacity="0.9"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="#f5f0e8"/>
  
  <!-- Organic form with vertical hatching -->
  <g transform="translate(200, 300)">
    <!-- Main form - organic rock/landscape shape -->
    <path d="M-80,-150 Q-60,-100 -90,-50 Q-70,0 -85,50 Q-65,100 -80,150 Q-40,120 -20,80 Q0,40 10,0 Q20,-40 0,-80 Q-20,-120 -80,-150 Z" 
          fill="url(#hatch-light)" stroke="#1a1a2e" stroke-width="1.5"/>
    
    <!-- Inner contour with varied density -->
    <path d="M-50,-120 Q-35,-80 -55,-40 Q-40,0 -50,40 Q-25,20 -10,0 Q5,-20 -10,-50 Q-20,-80 -50,-120 Z" 
          fill="url(#hatch-medium)" stroke="#1a1a2e" stroke-width="1"/>
    
    <!-- Core shadow - dense hatching -->
    <ellipse cx="-25" cy="-30" rx="20" ry="25" fill="url(#hatch-dense)"/>
    
    <!-- Contour breaks - intentional gaps -->
    <path d="M-80,-150 Q-60,-100 -90,-50" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-dasharray="8,4"/>
    <path d="M-85,50 Q-65,100 -80,150" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-dasharray="6,6"/>
  </g>
  
  <!-- Texture strokes - individual hatching lines -->
  <g stroke="#1a1a2e" stroke-width="0.8" fill="none" opacity="0.7">
    <!-- Left side texture -->
    <line x1="100" y1="200" x2="95" y2="280"/>
    <line x1="105" y1="210" x2="100" y2="290"/>
    <line x1="110" y1="205" x2="108" y2="275"/>
    
    <!-- Right side texture -->
    <line x1="300" y1="200" x2="305" y2="270"/>
    <line x1="295" y1="210" x2="302" y2="285"/>
    <line x1="290" y1="205" x2="295" y2="275"/>
  </g>
  
  <!-- Bottom ground plane with lighter hatching -->
  <rect x="50" y="450" width="300" height="100" fill="url(#hatch-light)" stroke="#1a1a2e" stroke-width="1"/>
  
  <!-- Top edge detail -->
  <path d="M80,80 Q120,70 160,85 Q200,75 240,90 Q280,80 320,85" 
        stroke="#1a1a2e" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Signature line -->
  <line x1="320" y1="550" x2="380" y2="550" stroke="#1a1a2e" stroke-width="1" opacity="0.5"/>
</svg>