<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 68: Vertical Hatching</text>
  
  <!-- Subject: Old wooden fence/gate -->
  <g filter="url(#grain)">
    <!-- Ground -->
    <path d="M0 420 Q100 410 200 420 Q300 430 400 415 L400 500 L0 500 Z" fill="#e0d8c8"/>
    
    <!-- Left fence section -->
    <g>
      <!-- Posts -->
      <rect x="40" y="150" width="15" height="270" fill="#b8a890"/>
      <rect x="130" y="160" width="12" height="260" fill="#b8a890"/>
      
      <!-- Vertical hatching left post -->
      <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
        <line x1="45" y1="160" x2="45" y2="200"/>
        <line x1="45" y1="215" x2="45" y2="270"/>
        <line x1="45" y1="285" x2="45" y2="350"/>
        <line x1="45" y1="365" x2="45" y2="410"/>
        
        <line x1="50" y1="160" x2="50" y2="195"/>
        <line x1="50" y1="210" x2="50" y2="265"/>
        <line x1="50" y1="280" x2="50" y2="340"/>
        <line x1="50" y1="355" x2="50" y2="410"/>
        
        <line x1="55" y1="160" x2="55" y2="190"/>
        <line x1="55" y1="205" x2="55" y2="260"/>
        <line x1="55" y1="275" x2="55" y2="330"/>
        <line x1="55" y1="345" x2="55" y2="410"/>
      </g>
      
      <!-- Vertical hatching right post -->
      <g stroke="#1a3a5c" stroke-width="0.9" stroke-linecap="round">
        <line x1="133" y1="170" x2="133" y2="210"/>
        <line x1="133" y1="225" x2="133" y2="280"/>
        <line x1="133" y1="295" x2="133" y2="360"/>
        <line x1="133" y1="375" x2="133" y2="415"/>
        
        <line x1="138" y1="170" x2="138" y2="205"/>
        <line x1="138" y1="220" x2="138" y2="275"/>
        <line x1="138" y1="290" x2="138" y2="350"/>
        <line x1="138" y1="365" x2="138" y2="415"/>
        
        <line x1="143" y1="170" x2="143" y2="200"/>
        <line x1="143" y1="215" x2="143" y2="270"/>
        <line x1="143" y1="285" x2="143" y2="340"/>
        <line x1="143" y1="355" x2="143" y2="415"/>
      </g>
      
      <!-- Horizontal rails -->
      <rect x="40" y="200" width="100" height="12" fill="#a89880"/>
      <rect x="40" y="280" width="105" height="12" fill="#a89880"/>
      <rect x="40" y="360" width="110" height="12" fill="#a89880"/>
      
      <!-- Rail hatching -->
      <g stroke="#1a3a5c" stroke-width="0.6" stroke-linecap="round">
        <!-- Top rail -->
        <line x1="50" y1="203" x2="50" y2="209"/>
        <line x1="65" y1="203" x2="65" y2="209"/>
        <line x1="80" y1="203" x2="80" y2="209"/>
        <line x1="95" y1="203" x2="95" y2="209"/>
        <line x1="110" y1="203" x2="110" y2="209"/>
        <line x1="125" y1="203" x2="125" y2="209"/>
        
        <!-- Middle rail -->
        <line x1="50" y1="283" x2="50" y2="289"/>
        <line x1="70" y1="283" x2="70" y2="289"/>
        <line x1="90" y1="283" x2="90" y2="289"/>
        <line x1="110" y1="283" x2="110" y2="289"/>
        <line x1="130" y1="283" x2="130" y2="289"/>
        
        <!-- Bottom rail -->
        <line x1="50" y1="363" x2="50" y2="369"/>
        <line x1="70" y1="363" x2="70" y2="369"/>
        <line x1="90" y1="363" x2="90" y2="369"/>
        <line x1="110" y1="363" x2="110" y2="369"/>
        <line x1="130" y1="363" x2="130" y2="369"/>
      </g>
    </g>
    
    <!-- Gate in center -->
    <g>
      <!-- Gate frame -->
      <rect x="170" y="130" width="80" height="290" fill="#c8b890"/>
      <rect x="175" y="135" width="70" height="280" fill="#d0c098"/>
      
      <!-- Gate vertical bars -->
      <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
        <line x1="185" y1="145" x2="185" y2="405"/>
        <line x1="197" y1="145" x2="197" y2="405"/>
        <line x1="209" y1="145" x2="209" y2="405"/>
        <line x1="221" y1="145" x2="221" y2="405"/>
        <line x1="233" y1="145" x2="233" y2="405"/>
      </g>
      
      <!-- Horizontal gate braces -->
      <rect x="175" y="180" width="70" height="8" fill="#b8a880"/>
      <rect x="175" y="350" width="70" height="8" fill="#b8a880"/>
      
      <!-- Gate frame border -->
      <rect x="170" y="130" width="80" height="290" fill="none" stroke="#1a3a5c" stroke-width="2"/>
      
      <!-- Cross brace on gate -->
      <line" y1=" x1="175180" x2="245" y2="355" stroke="#a89870" stroke-width="6"/>
      <line x1="175" y1="355" x2="245" y2="180" stroke="#a89870" stroke-width="6"/>
    </g>
    
    <!-- Right fence section -->
    <g>
      <!-- Posts -->
      <rect x="270" y="165" width="12" height="255" fill="#b8a890"/>
      <rect x="350" y="155" width="14" height="265" fill="#b8a890"/>
      
      <!-- Vertical hatching left post of right section -->
      <g stroke="#1a3a5c" stroke-width="0.9" stroke-linecap="round">
        <line x1="273" y1="175" x2="273" y2="215"/>
        <line x1="273" y1="230" x2="273" y2="285"/>
        <line x1="273" y1="300" x2="273" y2="365"/>
        <line x1="273" y1="380" x2="273" y2="415"/>
        
        <line x1="278" y1="175" x2="278" y2="210"/>
        <line x1="278" y1="225" x2="278" y2="280"/>
        <line x1="278" y1="295" x2="278" y2="355"/>
        <line x1="278" y1="370" x2="278" y2="415"/>
        
        <line x1="283" y1="175" x2="283" y2="205"/>
        <line x1="283" y1="220" x2="283" y2="275"/>
        <line x1="283" y1="290" x2="283" y2="345"/>
        <line x1="283" y1="360" x2="283" y2="415"/>
      </g>
      
      <!-- Vertical hatching right post -->
      <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
        <line x1="353" y1="165" x2="353" y2="210"/>
        <line x1="353" y1="225" x2="353" y2="280"/>
        <line x1="353" y1="295" x2="353" y2="360"/>
        <line x1="353" y1="375" x2="353" y2="415"/>
        
        <line x1="358" y1="165" x2="358" y2="205"/>
        <line x1="358" y1="220" x2="358" y2="275"/>
        <line x1="358" y1="290" x2="358" y2="350"/>
        <line x1="358" y1="365" x2="358" y2="415"/>
        
        <line x1="363" y1="165" x2="363" y2="200"/>
        <line x1="363" y1="215" x2="363" y2="270"/>
        <line x1="363" y1="285" x2="363" y2="340"/>
        <line x1="363" y1="355" x2="363" y2="415"/>
      </g>
      
      <!-- Horizontal rails -->
      <rect x="270" y="215" width="80" height="10" fill="#a89880"/>
      <rect x="270" y="295" width="84" height="10" fill="#a89880"/>
      <rect x="270" y="375" width="90" height="10" fill="#a89880"/>
      
      <!-- Rail hatching -->
      <g stroke="#1a3a5c" stroke-width="0.5" stroke-linecap="round">
        <line x1="280" y1="218" x2="280" y2="222"/>
        <line x1="300" y1="218" x2="300" y2="222"/>
        <line x1="320" y1="218" x2="320" y2="222"/>
        <line x1="340" y1="218" x2="340" y2="222"/>
        
        <line x1="280" y1="298" x2="280" y2="302"/>
        <line x1="305" y1="298" x2="305" y2="302"/>
        <line x1="330" y1="298" x2="330" y2="302"/>
        <line x1="350" y1="298" x2="350" y2="302"/>
        
        <line x1="280" y1="378" x2="280" y2="382"/>
        <line x1="305" y1="378" x2="305" y2="382"/>
        <line x1="330" y1="378" x2="330" y2="382"/>
        <line x1="355" y1="378" x2="355" y2="382"/>
      </g>
    </g>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.3">
    <line x1="30" y1="435" x2="33" y2="470"/>
    <line x1="70" y1="440" x2="73" y2="480"/>
    <line x1="110" y1="432" x2="113" y2="465"/>
    <line x1="150" y1="438" x2="153" y2="472"/>
    <line x1="190" y1="435" x2="193" y2="468"/>
    <line x1="230" y1="430" x2="233" y2="462"/>
    <line x1="270" y1="438" x2="273" y2="475"/>
    <line x1="310" y1="432" x2="313" y2="465"/>
    <line x1="350" y1="440" x2="353" y2="478"/>
    <line x1="380" y1="435" x2="383" y2="468"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · fence gate · contour breaks</text>
</svg>