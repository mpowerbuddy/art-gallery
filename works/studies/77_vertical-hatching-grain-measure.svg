<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 77: Vertical Hatching</text>
  
  <!-- Subject: Old wooden grain measure/half-bushel -->
  <g filter="url(#grain)">
    <!-- Ground shadow -->
    <ellipse cx="200" cy="420" rx="85" ry="15" fill="#d0c8b8" opacity="0.5"/>
    
    <!-- Bucket body -->
    <path d="M100 180 Q100 280 130 380 L270 380 Q300 280 300 180 Z" fill="#c8b898"/>
    
    <!-- Top rim -->
    <ellipse cx="200" cy="180" rx="100" ry="25" fill="#d0c0a0"/>
    <ellipse cx="200" cy="180" rx="100" ry="25" fill="none" stroke="#1a3a5c" stroke-width="2"/>
    
    <!-- Bucket interior (dark) -->
    <ellipse cx="200" cy="185" rx="85" ry="20" fill="#3a3530"/>
    
    <!-- Bucket vertical hatching -->
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <!-- Left side (shadow) - dense -->
      <line x1="110" y1="200" x2="110" y2="240"/>
      <line x1="110" y1="255" x2="110" y2="310"/>
      <line x1="110" y1="325" x2="110" y2="370"/>
      <line x1="110" y1="385" x2="110" y2="410"/>
      
      <line x1="120" y1="195" x2="120" y2="230"/>
      <line x1="120" y1="245" x2="120" y2="300"/>
      <line x1="120" y1="315" x2="120" y2="365"/>
      <line x1="120" y1="380" x2="120" y2="410"/>
      
      <line x1="130" y1="190" x2="130" y2="220"/>
      <line x1="130" y1="235" x2="130" y2="290"/>
      <line x1="130" y1="305" x2="130" y2="360"/>
      <line x1="130" y1="375" x2="130" y2="410"/>
      
      <!-- Mid section -->
      <line x1="140" y1="185" x2="140" y2="210"/>
      <line x1="140" y1="225" x2="140" y2="280"/>
      <line x1="140" y1="295" x2="140" y2="355"/>
      <line x1="140" y1="370" x2="140" y2="410"/>
      
      <line x1="150" y1="180" x2="150" y2="200"/>
      <line x1="150" y1="215" x2="150" y2="270"/>
      <line x1="150" y1="285" x2="150" y2="350"/>
      <line x1="150" y1="365" x2="150" y2="410"/>
      
      <line x1="160" y1="178" x2="160" y2="195"/>
      <line x1="160" y1="210" x2="160" y2="265"/>
      <line x1="160" y1="280" x2="160" y2="345"/>
      <line x1="160" y1="360" x2="160" y2="410"/>
      
      <line x1="170" y1="175" x2="170" y2="190"/>
      <line x1="170" y1="205" x2="170" y2="260"/>
      <line x1="170" y1="275" x2="170" y2="340"/>
      <line x1="170" y1="355" x2="170" y2="410"/>
      
      <line x1="180" y1="175" x2="180" y2="185"/>
      <line x1="180" y1="200" x2="180" y2="255"/>
      <line x1="180" y1="270" x2="180" y2="335"/>
      <line x1="180" y1="350" x2="180" y2="410"/>
      
      <!-- Right side (lighter) - sparser -->
      <g stroke-width="0.7" opacity="0.6">
        <line x1="190" y1="175" x2="190" y2="185"/>
        <line x1="190" y1="200" x2="190" y2="255"/>
        <line x1="190" y1="270" x2="190" y2="335"/>
        <line x1="190" y1="350" x2="190" y2="410"/>
        
        <line x1="200" y1="175" x2="200" y2="185"/>
        <line x1="200" y1="200" x2="200" y2="255"/>
        <line x1="200" y1="270" x2="200" y2="335"/>
        <line x1="200" y1="350" x2="200" y2="410"/>
        
        <line x1="210" y1="175" x2="210" y2="190"/>
        <line x1="210" y1="205" x2="210" y2="260"/>
        <line x1="210" y1="275" x2="210" y2="340"/>
        <line x1="210" y1="355" x2="210" y2="410"/>
        
        <line x1="220" y1="178" x2="220" y2="195"/>
        <line x1="220" y1="210" x2="220" y2="265"/>
        <line x1="220" y1="280" x2="220" y2="345"/>
        <line x1="220" y1="360" x2="220" y2="410"/>
        
        <line x1="230" y1="180" x2="230" y2="200"/>
        <line x1="230" y1="215" x2="230" y2="270"/>
        <line x1="230" y1="285" x2="230" y2="350"/>
        <line x1="230" y1="365" x2="230" y2="410"/>
        
        <line x1="240" y1="185" x2="240" y2="210"/>
        <line x1="240" y1="225" x2="240" y2="280"/>
        <line x1="240" y1="295" x2="240" y2="355"/>
        <line x1="240" y1="370" x2="240" y2="410"/>
        
        <line x1="250" y1="190" x2="250" y2="220"/>
        <line x1="250" y1="235" x2="250" y2="290"/>
        <line x1="250" y1="305" x2="250" y2="360"/>
        <line x1="250" y1="375" x2="250" y2="410"/>
        
        <line x1="260" y1="195" x2="260" y2="230"/>
        <line x1="260" y1="245" x2="260" y2="300"/>
        <line x1="260" y1="315" x2="260" y2="365"/>
        <line x1="260" y1="380" x2="260" y2="410"/>
        
        <line x1="270" y1="200" x2="270" y2="240"/>
        <line x1="270" y1="255" x2="270" y2="310"/>
        <line x1="270" y1="325" x2="270" y2="370"/>
        <line x1="270" y1="385" x2="270" y2="410"/>
        
        <line x1="280" y1="210" x2="280" y2="255"/>
        <line x1="280" y1="270" x2="280" y2="325"/>
        <line x1="280" y1="340" x2="280" y2="375"/>
        <line x1="280" y1="390" x2="280" y2="410"/>
      </g>
    </g>
    
    <!-- Metal bands -->
    <path d="M105 220 Q105 235 115 240 L285 240 Q295 235 295 220" fill="none" stroke="#6a5a40" stroke-width="4"/>
    <path d="M115 320 Q115 335 125 340 L275 340 Q285 335 285 320" fill="none" stroke="#6a5a40" stroke-width="4"/>
    
    <!-- Band detail -->
    <g stroke="#1a3a5c" stroke-width="0.5" stroke-linecap="round" opacity="0.6">
      <line x1="120" y1="228" x2="120" y2="233"/>
      <line x1="140" y1="235" x2="140" y2="240"/>
      <line x1="160" y1="238" x2="160" y2="241"/>
      <line x1="200" y1="240" x2="200" y2="242"/>
      <line x1="240" y1="238" x2="240" y2="241"/>
      <line x1="260" y1="235" x2="260" y2="240"/>
      <line x1="280" y1="228" x2="280" y2="233"/>
      
      <line x1="125" y1="328" x2="125" y2="333"/>
      <line x1="145" y1="335" x2="145" y2="340"/>
      <line x1="165" y1="338" x2="165" y2="341"/>
      <line x1="200" y1="340" x2="200" y2="342"/>
      <line x1="235" y1="338" x2="235" y2="341"/>
      <line x1="255" y1="335" x2="255" y2="340"/>
      <line x1="275" y1="328" x2="275" y2="333"/>
    </g>
    
    <!-- Handle attachment points -->
    <circle cx="110" cy="220" r="4" fill="#5a4a30"/>
    <circle cx="290" cy="220" r="4" fill="#5a4a30"/>
    
    <!-- Handle (curved wood) -->
    <path d="M110 220 Q110 120 200 110 Q290 120 290 220" fill="none" stroke="#8a7a60" stroke-width="6"/>
    <path d="M110 220 Q110 120 200 110 Q290 120 290 220" fill="none" stroke="#a89880" stroke-width="3"/>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.25">
    <line x1="80" y1="435" x2="83" y2="465"/>
    <line x1="120" y1="440" x2="123" y2="475"/>
    <line x1="160" y1="432" x2="163" y2="462"/>
    <line x1="200" y1="438" x2="203" y2="470"/>
    <line x1="240" y1="435" x2="243" y2="468"/>
    <line x1="280" y1="440" x2="283" y2="475"/>
    <line x1="320" y1="432" x2="323" y2="462"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · grain measure · contour breaks</text>
</svg>