<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.2" result="diffLight">
        <feDistantLight azimuth="45" elevation="50"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 66: Vertical Hatching</text>
  
  <!-- Subject: Old wooden cart/wagon -->
  <g filter="url(#grain)">
    <!-- Ground -->
    <path d="M0 400 Q100 390 200 400 Q300 410 400 395 L400 500 L0 500 Z" fill="#e0d8c8"/>
    
    <!-- Cart body - main box -->
    <path d="M80 280 L80 380 L320 380 L320 280 Q200 260 80 280" fill="#c8bba8"/>
    
    <!-- Vertical hatching on cart sides -->
    <g stroke="#1a3a5c" stroke-width="1.2" stroke-linecap="round">
      <!-- Left side - shadow -->
      <line x1="85" y1="290" x2="85" y2="330"/>
      <line x1="85" y1="340" x2="85" y2="375"/>
      
      <line x1="95" y1="285" x2="95" y2="320"/>
      <line x1="95" y1="330" x2="95" y2="375"/>
      
      <line x1="105" y1="280" x2="105" y2="315"/>
      <line x1="105" y1="325" x2="105" y2="375"/>
      
      <line x1="115" y1="278" x2="115" y2="310"/>
      <line x1="115" y1="320" x2="115" y2="375"/>
      
      <!-- Front face -->
      <line x1="125" y1="275" x2="125" y2="305"/>
      <line x1="125" y1="315" x2="125" y2="375"/>
      
      <line x1="135" y1="272" x2="135" y2="300"/>
      <line x1="135" y1="310" x2="135" y2="375"/>
      
      <line x1="145" y1="270" x2="145" y2="295"/>
      <line x1="145" y1="305" x2="145" y2="375"/>
      
      <!-- Center front -->
      <line x1="155" y1="268" x2="155" y2="290"/>
      <line x1="155" y1="300" x2="155" y2="375"/>
      
      <line x1="165" y1="266" x2="165" y2="285"/>
      <line x1="165" y1="295" x2="165" y2="375"/>
      
      <line x1="175" y1="265" x2="175" y2="280"/>
      <line x1="175" y1="290" x2="175" y2="375"/>
      
      <!-- Right side - lighter -->
      <g stroke-width="0.8" opacity="0.6">
        <line x1="185" y1="265" x2="185" y2="280"/>
        <line x1="185" y1="290" x2="185" y2="375"/>
        
        <line x1="195" y1="266" x2="195" y2="285"/>
        <line x1="195" y1="295" x2="195" y2="375"/>
        
        <line x1="205" y1="268" x2="205" y2="290"/>
        <line x1="205" y1="300" x2="205" y2="375"/>
        
        <line x1="215" y1="270" x2="215" y2="295"/>
        <line x1="215" y1="305" x2="215" y2="375"/>
        
        <line x1="225" y1="272" x2="225" y2="300"/>
        <line x1="225" y1="310" x2="225" y2="375"/>
        
        <line x1="235" y1="275" x2="235" y2="305"/>
        <line x1="235" y1="315" x2="235" y2="375"/>
        
        <line x1="245" y1="278" x2="245" y2="310"/>
        <line x1="245" y1="320" x2="245" y2="375"/>
        
        <line x1="255" y1="280" x2="255" y2="315"/>
        <line x1="255" y1="325" x2="255" y2="375"/>
        
        <line x1="265" y1="285" x2="265" y2="320"/>
        <line x1="265" y1="330" x2="265" y2="375"/>
        
        <line x1="275" y1="290" x2="275" y2="330"/>
        <line x1="275" y1="340" x2="275" y2="375"/>
        
        <line x1="285" y1="295" x2="285" y2="340"/>
      </g>
    </g>
    
    <!-- Cart front panel detail -->
    <path d="M80 280 L200 260 L320 280 L320 300 L200 285 L80 300 Z" fill="#b8a890"/>
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="120" y1="285" x2="120" y2="295"/>
      <line x1="140" y1="278" x2="140" y2="290"/>
      <line x1="160" y1="272" x2="160" y2="285"/>
      <line x1="180" y1="268" x2="180" y2="282"/>
      <line x1="200" y1="265" x2="200" y2="280"/>
      <line x1="220" y1="268" x2="220" y2="282"/>
      <line x1="240" y1="272" x2="240" y2="285"/>
      <line x1="260" y1="278" x2="260" y2="290"/>
      <line x1="280" y1="285" x2="280" y2="295"/>
    </g>
    
    <!-- Wheels -->
    <!-- Left wheel -->
    <circle cx="110" cy="400" r="50" fill="#a89070"/>
    <circle cx="110" cy="400" r="45" fill="none" stroke="#1a3a5c" stroke-width="2"/>
    <!-- Wheel spokes with hatching -->
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <line x1="110" y1="360" x2="110" y2="375"/>
      <line x1="110" y1="425" x2="110" y2="440"/>
      <line x1="75" y1="400" x2="85" y2="400"/>
      <line x1="135" y1="400" x2="145" y2="400"/>
      <line x1="85" y1="370" x2="92" y2="378"/>
      <line x1="128" y1="422" x2="135" y2="430"/>
      <line x1="85" y1="430" x2="92" y2="422"/>
      <line x1="128" y1="378" x2="135" y2="370"/>
    </g>
    <!-- Wheel hub -->
    <circle cx="110" cy="400" r="8" fill="#8a7a60"/>
    <circle cx="110" cy="400" r="4" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    
    <!-- Right wheel -->
    <circle cx="290" cy="400" r="50" fill="#a89070"/>
    <circle cx="290" cy="400" r="45" fill="none" stroke="#1a3a5c" stroke-width="2"/>
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <line x1="290" y1="360" x2="290" y2="375"/>
      <line x1="290" y1="425" x2="290" y2="440"/>
      <line x1="255" y1="400" x2="265" y2="400"/>
      <line x1="315" y1="400" x2="325" y2="400"/>
      <line x1="265" y1="370" x2="272" y2="378"/>
      <line x1="308" y1="422" x2="315" y2="430"/>
      <line x1="265" y1="430" x2="272" y2="422"/>
      <line x1="308" y1="378" x2="315" y2="370"/>
    </g>
    <circle cx="290" cy="400" r="8" fill="#8a7a60"/>
    <circle cx="290" cy="400" r="4" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    
    <!-- Axle -->
    <rect x="110" y="395" width="180" height="10" fill="#9a8565"/>
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="120" y1="398" x2="120" y2="402"/>
      <line x1="140" y1="398" x2="140" y2="402"/>
      <line x1="160" y1="398" x2="160" y2="402"/>
      <line x1="180" y1="398" x2="180" y2="402"/>
      <line x1="200" y1="398" x2="200" y2="402"/>
      <line x1="220" y1="398" x2="220" y2="402"/>
      <line x1="240" y1="398" x2="240" y2="402"/>
      <line x1="260" y1="398" x2="260" y2="402"/>
      <line x1="280" y1="398" x2="280" y2="402"/>
    </g>
    
    <!-- Handle/runner at front -->
    <path d="M310 380 Q340 390 360 420 L320 420" fill="#b8a890"/>
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round">
      <line x1="320" y1="390" x2="320" y2="415"/>
      <line x1="330" y1="385" x2="330" y2="418"/>
      <line x1="340" y1="388" x2="340" y2="420"/>
    </g>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.3">
    <line x1="40" y1="450" x2="43" y2="480"/>
    <line x1="80" y1="445" x2="83" y2="475"/>
    <line x1="120" y1="452" x2="123" y2="485"/>
    <line x1="160" y1="448" x2="163" y2="478"/>
    <line x1="200" y1="450" x2="203" y2="482"/>
    <line x1="240" y1="445" x2="243" y2="475"/>
    <line x1="280" y1="452" x2="283" y2="485"/>
    <line x1="320" y1="448" x2="323" y2="478"/>
    <line x1="360" y1="450" x2="363" y2="480"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · wooden cart · contour breaks</text>
</svg>