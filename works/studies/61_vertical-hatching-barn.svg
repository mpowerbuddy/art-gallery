<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.5" result="diffLight">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 61: Vertical Hatching</text>
  
  <!-- Subject: Old barn with vertical wood plank texture -->
  <!-- Main barn structure -->
  <g filter="url(#grain)">
    <!-- Barn body - left side in shadow -->
    <path d="M60 120 L60 420 L180 420 L180 120 Z" fill="#e8e0d0"/>
    
    <!-- Vertical hatching - shadow areas (left side) -->
    <!-- Dense vertical lines for deep shadow -->
    <g stroke="#1a3a5c" stroke-width="1.2" stroke-linecap="round">
      <!-- Contour breaks - lines that stop and start -->
      <line x1="70" y1="130" x2="70" y2="180"/>
      <line x1="70" y1="190" x2="70" y2="220"/>
      <line x1="70" y1="235" x2="70" y2="280"/>
      <line x1="70" y1="295" x2="70" y2="340"/>
      <line x1="70" y1="355" x2="70" y2="400"/>
      
      <line x1="85" y1="130" x2="85" y2="160"/>
      <line x1="85" y1="175" x2="85" y2="250"/>
      <line x1="85" y1="265" x2="85" y2="320"/>
      <line x1="85" y1="335" x2="85" y2="380"/>
      <line x1="85" y1="395" x2="85" y2="415"/>
      
      <!-- Medium density for mid-tones -->
      <line x1="100" y1="130" x2="100" y2="155"/>
      <line x1="100" y1="165" x2="100" y2="200"/>
      <line x1="100" y1="215" x2="100" y2="260"/>
      <line x1="100" y1="275" x2="100" y2="310"/>
      <line x1="100" y1="325" x2="100" y2="370"/>
      <line x1="100" y1="385" x2="100" y2="415"/>
      
      <!-- Thinner, sparser lines for lighter areas -->
      <line x1="115" y1="130" x2="115" y2="150"/>
      <line x1="115" y1="160" x2="115" y2="185"/>
      <line x1="115" y1="200" x2="115" y2="230"/>
      <line x1="115" y1="245" x2="115" y2="275"/>
      <line x1="115" y1="290" x2="115" y2="330"/>
      <line x1="115" y1="345" x2="115" y2="380"/>
      <line x1="115" y1="395" x2="115" y2="415"/>
      
      <!-- Contour breaks on right edge -->
      <line x1="130" y1="130" x2="130" y2="165"/>
      <line x1="130" y1="180" x2="130" y2="220"/>
      <line x1="130" y1="235" x2="130" y2="280"/>
      <line x1="130" y1="295" x2="130" y2="340"/>
      <line x1="130" y1="355" x2="130" y2="410"/>
      
      <line x1="145" y1="130" x2="145" y2="175"/>
      <line x1="145" y1="190" x2="145" y2="240"/>
      <line x1="145" y1="255" x2="145" y2="300"/>
      <line x1="145" y1="315" x2="145" y2="360"/>
      <line x1="145" y1="375" x2="145" y2="415"/>
      
      <line x1="160" y1="130" x2="160" y2="185"/>
      <line x1="160" y1="200" x2="160" y2="255"/>
      <line x1="160" y1="270" x2="160" y2="320"/>
      <line x1="160" y1="335" x2="160" y2="380"/>
      <line x1="160" y1="395" x2="160" y2="415"/>
    </g>
    
    <!-- Barn right side - lighter -->
    <path d="M180 120 L180 420 L280 420 L280 200 L220 120 Z" fill="#f0e8d8"/>
    
    <!-- Right side - sparser hatching for highlight -->
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
      <line x1="195" y1="130" x2="195" y2="160"/>
      <line x1="195" y1="175" x2="195" y2="200"/>
      <line x1="195" y1="215" x2="195" y2="250"/>
      <line x1="195" y1="265" x2="195" y2="300"/>
      <line x1="195" y1="315" x2="195" y2="360"/>
      <line x1="195" y1="375" x2="195" y2="415"/>
      
      <line x1="210" y1="130" x2="210" y2="170"/>
      <line x1="210" y1="185" x2="210" y2="220"/>
      <line x1="210" y1="235" x2="210" y2="280"/>
      <line x1="210" y1="295" x2="210" y2="340"/>
      <line x1="210" y1="355" x2="210" y2="400"/>
      
      <line x1="225" y1="135" x2="225" y2="180"/>
      <line x1="225" y1="195" x2="225" y2="240"/>
      <line x1="225" y1="255" x2="225" y2="300"/>
      <line x1="225" y1="315" x2="225" y2="360"/>
      <line x1="225" y1="375" x2="225" y2="405"/>
      
      <line x1="240" y1="140" x2="240" y2="190"/>
      <line x1="240" y1="205" x2="240" y2="260"/>
      <line x1="240" y1="275" x2="240" y2="320"/>
      <line x1="240" y1="335" x2="240" y2="380"/>
      <line x1="240" y1="395" x2="240" y2="410"/>
    </g>
    
    <!-- Roof -->
    <path d="M50 120 L170 40 L310 100 L280 200 L60 200 Z" fill="#d8cfc0"/>
    
    <!-- Roof hatching - diagonal vertical lines for texture -->
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <!-- Dense area near top left -->
      <line x1="80" y1="100" x2="80" y2="120"/>
      <line x1="95" y1="85" x2="95" y2="115"/>
      <line x1="110" y1="75" x2="110" y2="105"/>
      <line x1="125" y1="65" x2="125" y2="95"/>
      <line x1="140" y1="55" x2="140" y2="85"/>
      <line x1="155" y1="45" x2="155" y2="75"/>
      
      <!-- Mid density -->
      <line x1="170" y1="40" x2="170" y2="65"/>
      <line x1="185" y1="50" x2="185" y2="80"/>
      <line x1="200" y1="60" x2="200" y2="90"/>
      <line x1="215" y1="70" x2="215" y2="100"/>
      <line x1="230" y1="80" x2="230" y2="110"/>
      <line x1="245" y1="90" x2="245" y2="120"/>
      <line x1="260" y1="100" x2="260" y2="130"/>
      <line x1="275" y1="110" x2="275" y2="140"/>
    </g>
    
    <!-- Door - heavily hatched -->
    <rect x="90" y="250" width="60" height="170" fill="#c8bba8"/>
    <g stroke="#1a3a5c" stroke-width="1.5" stroke-linecap="round">
      <!-- Door vertical lines with contour breaks -->
      <line x1="100" y1="260" x2="100" y2="300"/>
      <line x1="100" y1="315" x2="100" y2="360"/>
      <line x1="100" y1="375" x2="100" y2="410"/>
      
      <line x1="112" y1="260" x2="112" y2="290"/>
      <line x1="112" y1="305" x2="112" y2="350"/>
      <line x1="112" y1="365" x2="112" y2="410"/>
      
      <line x1="124" y1="260" x2="124" y2="285"/>
      <line x1="124" y1="300" x2="124" y2="345"/>
      <line x1="124" y1="360" x2="124" y2="410"/>
      
      <line x1="136" y1="260" x2="136" y2="295"/>
      <line x1="136" y1="310" x2="136" y2="355"/>
      <line x1="136" y1="370" x2="136" y2="410"/>
      
      <!-- Horizontal brace -->
      <line x1="90" y1="330" x2="150" y2="330" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Ground - rolling hills with light hatching -->
  <path d="M0 420 Q100 400 200 420 Q300 440 400 410 L400 500 L0 500 Z" fill="#e8e0d0"/>
  <g stroke="#1a3a5c" stroke-width="0.6" stroke-linecap="round" opacity="0.4">
    <line x1="20" y1="440" x2="20" y2="460"/>
    <line x1="40" y1="435" x2="40" y2="470"/>
    <line x1="60" y1="445" x2="60" y2="480"/>
    <line x1="80" y1="430" x2="80" y2="465"/>
    <line x1="100" y1="440" x2="100" y2="475"/>
    <line x1="120" y1="435" x2="120" y2="470"/>
    <line x1="140" y1="445" x2="140" y2="485"/>
    <line x1="160" y1="425" x2="160" y2="460"/>
    <line x1="180" y1="438" x2="180" y2="475"/>
    <line x1="200" y1="432" x2="200" y2="468"/>
    <line x1="220" y1="440" x2="220" y2="480"/>
    <line x1="240" y1="428" x2="240" y2="465"/>
    <line x1="260" y1="438" x2="260" y2="475"/>
    <line x1="280" y1="425" x2="280" y2="460"/>
    <line x1="300" y1="435" x2="300" y2="470"/>
    <line x1="320" y1="442" x2="320" y2="480"/>
    <line x1="340" y1="430" x2="340" y2="465"/>
    <line x1="360" y1="438" x2="360" y2="475"/>
    <line x1="380" y1="425" x2="380" y2="458"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · contour breaks · varied density</text>
</svg>