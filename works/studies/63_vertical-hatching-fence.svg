<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="50"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 63: Vertical Hatching</text>
  
  <!-- Subject: Fence posts along a field -->
  <g filter="url(#grain)">
    <!-- Sky suggestion -->
    <rect x="0" y="0" width="400" height="200" fill="#e8e5db"/>
    
    <!-- Distant hills -->
    <path d="M0 180 Q80 160 160 175 Q240 190 320 170 Q360 160 400 175 L400 200 L0 200 Z" fill="#ddd5c5"/>
    
    <!-- Field -->
    <path d="M0 200 Q150 210 250 200 Q350 190 400 205 L400 420 L0 420 Z" fill="#e5dcc8"/>
    
    <!-- Fence post 1 - closest, left -->
    <g>
      <rect x="50" y="150" width="25" height="270" fill="#c8bcA0"/>
      <!-- Vertical hatching -->
      <g stroke="#1a3a5c" stroke-width="1.2" stroke-linecap="round">
        <line x1="55" y1="160" x2="55" y2="200"/>
        <line x1="55" y1="215" x2="55" y2="270"/>
        <line x1="55" y1="285" x2="55" y2="350"/>
        <line x1="55" y1="365" x2="55" y2="410"/>
        
        <line x1="62" y1="160" x2="62" y2="195"/>
        <line x1="62" y1="210" x2="62" y2="265"/>
        <line x1="62" y1="280" x2="62" y2="340"/>
        <line x1="62" y1="355" x2="62" y2="410"/>
        
        <line x1="69" y1="160" x2="69" y2="190"/>
        <line x1="69" y1="205" x2="69" y2="260"/>
        <line x1="69" y1="275" x2="69" y2="330"/>
        <line x1="69" y1="345" x2="69" y2="410"/>
      </g>
      <!-- Post top detail -->
      <path d="M50 150 L50 145 Q62 140 75 145 L75 150 Z" fill="#b8ac90"/>
    </g>
    
    <!-- Fence post 2 - middle -->
    <g>
      <rect x="140" y="165" width="20" height="255" fill="#c8bcA0"/>
      <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
        <line x1="144" y1="175" x2="144" y2="210"/>
        <line x1="144" y1="225" x2="144" y2="280"/>
        <line x1="144" y1="295" x2="144" y2="360"/>
        <line x1="144" y1="375" x2="144" y2="410"/>
        
        <line x1="150" y1="175" x2="150" y2="205"/>
        <line x1="150" y1="220" x2="150" y2="275"/>
        <line x1="150" y1="290" x2="150" y2="350"/>
        <line x1="150" y1="365" x2="150" y2="410"/>
        
        <line x1="156" y1="175" x2="156" y2="200"/>
        <line x1="156" y1="215" x2="156" y2="270"/>
        <line x1="156" y1="285" x2="156" y2="340"/>
        <line x1="156" y1="355" x2="156" y2="410"/>
      </g>
      <path d="M140 165 L140 160 Q150 155 160 160 L160 165 Z" fill="#b8ac90"/>
    </g>
    
    <!-- Fence post 3 - further back -->
    <g>
      <rect x="230" y="175" width="18" height="245" fill="#c8bcA0"/>
      <g stroke="#1a3a5c" stroke-width="0.9" stroke-linecap="round" opacity="0.9">
        <line x1="234" y1="185" x2="234" y2="220"/>
        <line x1="234" y1="235" x2="234" y2="290"/>
        <line x1="234" y1="305" x2="234" y2="365"/>
        <line x1="234" y1="380" x2="234" y2="410"/>
        
        <line x1="239" y1="185" x2="239" y2="215"/>
        <line x1="239" y1="230" x2="239" y2="285"/>
        <line x1="239" y1="300" x2="239" y2="355"/>
        <line x1="239" y1="370" x2="239" y2="410"/>
        
        <line x1="244" y1="185" x2="244" y2="210"/>
        <line x1="244" y1="225" x2="244" y2="280"/>
        <line x1="244" y1="295" x2="244" y2="350"/>
        <line x1="244" y1="365" x2="244" y2="410"/>
      </g>
      <path d="M230 175 L230 170 Q239 165 248 170 L248 175 Z" fill="#b8ac90"/>
    </g>
    
    <!-- Fence post 4 - furthest -->
    <g>
      <rect x="320" y="185" width="15" height="235" fill="#c8bcA0"/>
      <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round" opacity="0.8">
        <line x1="323" y1="195" x2="323" y2="230"/>
        <line x1="323" y1="245" x2="323" y2="300"/>
        <line x1="323" y1="315" x2="323" y2="370"/>
        <line x1="323" y1="385" x2="323" y2="410"/>
        
        <line x1="328" y1="195" x2="328" y2="225"/>
        <line x1="328" y1="240" x2="328" y2="295"/>
        <line x1="328" y1="310" x2="328" y2="360"/>
        <line x1="328" y1="375" x2="328" y2="410"/>
        
        <line x1="333" y1="195" x2="333" y2="220"/>
        <line x1="333" y1="235" x2="333" y2="290"/>
        <line x1="333" y1="305" x2="333" y2="355"/>
        <line x1="333" y1="370" x2="333" y2="410"/>
      </g>
      <path d="M320 185 L320 180 Q327 175 335 180 L335 185 Z" fill="#b8ac90"/>
    </g>
    
    <!-- Horizontal fence wire -->
    <g stroke="#2a4a6c" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
      <line x1="40" y1="230" x2="350" y2="245"/>
      <line x1="40" y1="280" x2="350" y2="295"/>
      <line x1="40" y1="330" x2="350" y2="345"/>
    </g>
  </g>
  
  <!-- Ground - simple grass texture with vertical hatching -->
  <path d="M0 420 L400 420 L400 500 L0 500 Z" fill="#dcd3c3"/>
  <g stroke="#2a4a6c" stroke-width="0.5" stroke-linecap="round" opacity="0.35">
    <line x1="15" y1="425" x2="18" y2="455"/>
    <line x1="35" y1="430" x2="38" y2="465"/>
