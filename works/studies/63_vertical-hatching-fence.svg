    <line x1="135" y1="430" x2="138" y2="468"/>
    <line x1="155" y1="428" x2="158" y2="460"/>
    <line x1="175" y1="432" x2="178" y2="472"/>
    <line x1="195" y1="425" x2="198" y2="458"/>
    <line x1="215" y1="430" x2="218" y2="465"/>
    <line x1="235" y1="428" x2="238" y2="462"/>
    <line x1="255" y1="425" x2="258" y2="455"/>
    <line x1="275" y1="432" x2="278" y2="470"/>
    <line x1="295" y1="428" x2="298" y2="460"/>
    <line x1="315" y1="430" x2="318" y2="468"/>
    <line x1="335" y1="425" x2="338" y2="458"/>
    <line x1="355" y1="432" x2="358" y2="472"/>
    <line x1="375" y1="428" x2="378" y2="465"/>
    <line x1="390" y1="425" x2="392" y2="452"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · fence posts · perspective depth</text>
</svg>