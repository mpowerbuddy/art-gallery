      <line x1="120" y1="135" x2="185" y2="135"/>
      <line x1="185" y1="135" x2="270" y2="135"/>
      <line x1="270" y1="135" x2="350" y2="135"/>
      
      <line x1="45" y1="195" x2="105" y2="195"/>
