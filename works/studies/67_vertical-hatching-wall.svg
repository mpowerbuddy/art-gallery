      <line x1="185" y1="195" x2="259" y2="195"/>
      <line x1="259" y1="195" x2="350" y2="195"/>
      
      <line x1="45" y1="260" x2="115" y2="260"/>
      <line x1="115" y1="260" x2="205" y2="260"/>
      <line x1="205" y1="260" x2="270" y2="260"/>
      <line x1="270" y1="260" x2="350" y2="260"/>
      
      <line x1="45" y1="325" x2="125" y2="325"/>
