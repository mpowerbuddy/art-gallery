<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.4" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 67: Vertical Hatching</text>
  
  <!-- Subject: Old stone wall with cracks -->
  <g filter="url(#grain)">
    <!-- Stone wall structure -->
    <rect x="40" y="80" width="320" height="350" fill="#d8cfc2"/>
    
