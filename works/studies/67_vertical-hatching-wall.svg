      <line x1="185" y1="85" x2="185" y2="140"/>
      <line x1="270" y1="85" x2="270" y2="140"/>
      
      <line x1="105" y1="140" x2="105" y2="195"/>
      <line x1="185" y1="140" x2="185" y2="200"/>
      <line x1="259" y1="140" x2="259" y2="195"/>
      
