    <rect x="125" y="325" width="60" height="55" fill="#d0c5b2"/>
    <rect x="190" y="325" width="80" height="55" fill="#d5cbb8"/>
    <rect x="275" y="325" width="75" height="55" fill="#d0c5b2"/>
    
    <!-- Row 6 (bottom) -->
