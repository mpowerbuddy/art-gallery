    <rect x="120" y="385" width="65" height="45" fill="#d5cbb8"/>
    <rect x="190" y="385" width="75" height="45" fill="#d0c5b2"/>
    <rect x="270" y="385" width="80" height="45" fill="#d5cbb8"/>
    
    <!-- Vertical hatching for stone texture -->
