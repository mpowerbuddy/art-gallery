  <!-- Ground at base -->
  <rect x="0" y="430" width="400" height="70" fill="#e0d8c8"/>
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.25">
    <line x1="20" y1="440" x2="23" y2="470"/>
    <line x1="60" y1="445" x2="63" y2="480"/>
    <line x1="100" y1="438" x2="103" y2="468"/>
    <line x1="140" y1="442" x2="143" y2="475"/>
    <line x1="180" y1="440" x2="183" y2="470"/>
    <line x1="220" y1="445" x2="223" y2="480"/>
    <line x1="260" y1="438" x2="263" y2="468"/>
    <line x1="300" y1="442" x2="303" y2="475"/>
    <line x1="340" y1="440" x2="343" y2="470"/>
    <line x1="380" y1="445" x2="383" y2="478"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · stone wall · contour breaks</text>
</svg>