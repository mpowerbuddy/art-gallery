      <line x1="115" y1="265" x2="115" y2="325"/>
      <line x1="205" y1="265" x2="205" y2="325"/>
      <line x1="270" y1="265" x2="270" y2="325"/>
      
      <line x1="125" y1="325" x2="125" y2="385"/>
      <line x1="190" y1="325" x2="190" y2="385"/>
      <line x1="275" y1="325" x2="275" y2="385"/>
