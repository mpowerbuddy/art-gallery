    <!-- Cracks in stone -->
    <g stroke="#1a3a5c" stroke-width="0.5" fill="none" opacity="0.5">
      <path d="M75 90 Q78 110 72 130"/>
      <path d="M220 145 Q225 165 218 180"/>
      <path d="M140 210 Q145 235 138 250"/>
      <path d="M260 280 Q255 305 265 325"/>
      <path d="M55 350 Q60 370 52 385"/>
    </g>
    
    <!-- Vegetation growing from wall -->
    <g stroke="#2a4a3c" stroke-width="0.6" stroke-linecap="round">
      <path d="M60 85 Q65 70 55 55" fill="none"/>
      <path d="M55 65 Q50 55 60 45" fill="none"/>
      <path d="M310 85 Q315 65 305 50" fill="none"/>
      <path d="M305 70 Q295 60 308 48" fill="none"/>
    </g>
