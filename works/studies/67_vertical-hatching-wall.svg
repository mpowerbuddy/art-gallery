      <line x1="70" y1="280" x2="70" y2="315"/>
      <line x1="85" y1="278" x2="85" y2="312"/>
      
      <line x1="125" y1="275" x2="125" y2="315"/>
      <line x1="145" y1="280" x2="145" y2="312"/>
      <line x1="165" y1="278" x2="165" y2="315"/>
      <line x1="185" y1="282" x2="185" y2="318"/>
      
