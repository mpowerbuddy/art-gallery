    <rect x="185" y="85" width="80" height="50" fill="#d5cbb8"/>
    <rect x="270" y="85" width="80" height="50" fill="#d0c5b2"/>
    
    <!-- Row 2 -->
    <rect x="45" y="140" width="55" height="55" fill="#d0c5b2"/>
    <rect x="105" y="140" width="75" height="55" fill="#d5cbb8"/>
    <rect x="185" y="140" width="65" height="55" fill="#d0c5b2"/>
    <rect x="259" y="140" width="90" height="55" fill="#d5cbb8"/>
    
    <!-- Row 3 -->
