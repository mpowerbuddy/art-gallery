      <line x1="85" y1="212" x2="85" y2="252"/>
      <line x1="100" y1="218" x2="100" y2="258"/>
      
      <line x1="140" y1="210" x2="140" y2="255"/>
      <line x1="155" y1="215" x2="155" y2="252"/>
      
      <line x1="200" y1="212" x2="200" y2="258"/>
      <line x1="220" y1="218" x2="220" y2="255"/>
      <line x1="240" y1="215" x2="240" y2="252"/>
      
