    <rect x="190" y="200" width="70" height="60" fill="#d8cfc2"/>
    <rect x="265" y="200" width="85" height="60" fill="#d5cbb8"/>
    
    <!-- Row 4 -->
    <rect x="45" y="265" width="65" height="55" fill="#d0c5b2"/>
    <rect x="115" y="265" width="85" height="55" fill="#d5cbb8"/>
    <rect x="205" y="265" width="60" height="55" fill="#d0c5b2"/>
    <rect x="270" y="265" width="80" height="55" fill="#d8cfc2"/>
    
    <!-- Row 5 -->
