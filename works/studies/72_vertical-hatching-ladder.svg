      <line x1="175" y1="254" x2="175" y2="260"/>
      <line x1="190" y1="254" x2="190" y2="260"/>
      <line x1="205" y1="254" x2="205" y2="260"/>
      <line x1="220" y1="254" x2="220" y2="260"/>
      <line x1="235" y1="254" x2="235" y2="260"/>
      <line x1="250" y1="254" x2="250" y2="260"/>
