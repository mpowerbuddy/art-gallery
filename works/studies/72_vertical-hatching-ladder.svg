    <!-- Top cap detail on rails -->
    <rect x="118" y="70" width="22" height="12" fill="#a89880"/>
    <rect x="260" y="70" width="22" height="12" fill="#a89880"/>
    
    <!-- Rail end grain suggestion -->
    <g stroke="#1a3a5c" stroke-width="0.5" stroke-linecap="round" opacity="0.6">
      <ellipse cx="129" cy="76" rx="8" ry="4"/>
      <ellipse cx="271" cy="76" rx="8" ry="4"/>
    </g>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.25">
    <line x1="80" y1="440" x2="83" y2="470"/>
    <line x1="120" y1="445" x2="123" y2="478"/>
    <line x1="160" y1="438" x2="163" y2="465"/>
    <line x1="200" y1="442" x2="203" y2="475"/>
    <line x1="240" y1="440" x2="243" y2="468"/>
    <line x1="280" y1="445" x2="283" y2="480"/>
    <line x1="320" y1="438" x2="323" y2="465"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · wooden ladder · contour breaks</text>
</svg>