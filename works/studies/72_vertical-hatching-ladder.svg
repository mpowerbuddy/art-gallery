<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 72: Vertical Hatching</text>
  
  <!-- Subject: Old wooden ladder -->
  <g filter="url(#grain)">
    <!-- Ground -->
    <path d="M0 430 Q100 420 200 430 Q300 440 400 425 L400 500 L0 500 Z" fill="#e0d8c8"/>
    
    <!-- Left rail -->
    <rect x="120" y="80" width="18" height="350" fill="#b8a890"/>
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
