<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.2" result="diffLight">
        <feDistantLight azimuth="45" elevation="50"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 71: Vertical Hatching</text>
  
  <!-- Subject: Old wooden barrel/cask -->
  <g filter="url(#grain)">
    <!-- Ground shadow -->
    <ellipse cx="200" cy="430" rx="90" ry="20" fill="#d0c8b8" opacity="0.5"/>
    
    <!-- Barrel body - main cylinder -->
    <ellipse cx="200" cy="140" rx="70" ry="20" fill="#c8b898"/>
    <rect x="130" y="140" width="140" height="290" fill="#d0c0a0"/>
    <ellipse cx="200" cy="430" rx="70" ry="20" fill="#b8a890"/>
    
    <!-- Barrel bands/hoops -->
    <rect x="128" y="175" width="144" height="12" fill="#6a5a40"/>
    <rect x="128" y="290" width="144" height="12" fill="#6a5a40"/>
    <rect x="128" y="395" width="144" height="12" fill="#6a5a40"/>
    
    <!-- Vertical hatching on barrel body -->
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <!-- Left side (shadow) - dense -->
      <line x1="138" y1="155" x2="138" y2="195"/>
      <line x1="138" y1="210" x2="138" y2="270"/>
      <line x1="138" y1="285" x2="138" y2="350"/>
      <line x1="138" y1="365" x2="138" y2="420"/>
      
      <line x1="146" y1="150" x2="146" y2="190"/>
      <line x1="146" y1="205" x2="146" y2="265"/>
      <line x1="146" y1="280" x2="146" y2="345"/>
      <line x1="146" y1="360" x2="146" y2="420"/>
      
      <line x1="154" y1="148" x2="154" y2="185"/>
      <line x1="154" y1="200" x2="154" y2="260"/>
      <line x1="154" y1="275" x2="154" y2="340"/>
      <line x1="154" y1="355" x2="154" y2="420"/>
      
      <!-- Mid section -->
      <line x1="162" y1="145" x2="162" y2="180"/>
      <line x1="162" y1="195" x2="162" y2="255"/>
      <line x1="162" y1="270" x2="162" y2="335"/>
      <line x1="162" y1="350" x2="162" y2="420"/>
      
      <line x1="170" y1="143" x2="170" y2="175"/>
      <line x1="170" y1="190" x2="170" y2="250"/>
      <line x1="170" y1="265" x2="170" y2="330"/>
      <line x1="170" y1="345" x2="170" y2="420"/>
      
      <line x1="178" y1="142" x2="178" y2="170"/>
      <line x1="178" y1="185" x2="178" y2="245"/>
      <line x1="178" y1="260" x2="178" y2="325"/>
      <line x1="178" y1="340" x2="178" y2="420"/>
      
      <line x1="186" y1="140" x2="186" y2="165"/>
      <line x1="186" y1="180" x2="186" y2="240"/>
      <line x1="186" y1="255" x2="186" y2="320"/>
      <line x1="186" y1="335" x2="186" y2="420"/>
      
      <!-- Right side (lighter) - sparser -->
      <g stroke-width="0.7" opacity="0.6">
        <line x1="194" y1="140" x2="194" y2="165"/>
        <line x1="194" y1="180" x2="194" y2="240"/>
        <line x1="194" y1="255" x2="194" y2="320"/>
        <line x1="194" y1="335" x2="194" y2="420"/>
        
        <line x1="202" y1="142" x2="202" y2="170"/>
        <line x1="202" y1="185" x2="202" y2="245"/>
        <line x1="202" y1="260" x2="202" y2="325"/>
        <line x1="202" y1="340" x2="202" y2="420"/>
        
        <line x1="210" y1="143" x2="210" y2="175"/>
        <line x1="210" y1="190" x2="210" y2="250"/>
        <line x1="210" y1="265" x2="210" y2="330"/>
        <line x1="210" y1="345" x2="210" y2="420"/>
        
        <line x1="218" y1="145" x2="218" y2="180"/>
        <line x1="218" y1="195" x2="218" y2="255"/>
        <line x1="218" y1="270" x2="218" y2="335"/>
        <line x1="218" y1="350" x2="218" y2="420"/>
        
        <line x1="226" y1="148" x2="226" y2="185"/>
        <line x1="226" y1="200" x2="226" y2="260"/>
        <line x1="226" y1="275" x2="226" y2="340"/>
        <line x1="226" y1="355" x2="226" y2="420"/>
        
        <line x1="234" y1="150" x2="234" y2="190"/>
        <line x1="234" y1="205" x2="234" y2="265"/>
        <line x1="234" y1="280" x2="234" y2="345"/>
        <line x1="234" y1="360" x2="234" y2="420"/>
        
        <line x1="242" y1="155" x2="242" y2="195"/>
        <line x1="242" y1="210" x2="242" y2="270"/>
        <line x1="242" y1="285" x2="242" y2="350"/>
        <line x1="242" y1="365" x2="242" y2="420"/>
        
        <line x1="250" y1="158" x2="250" y2="200"/>
        <line x1="250" y1="215" x2="250" y2="275"/>
        <line x1="250" y1="290" x2="250" y2="355"/>
        <line x1="250" y1="370" x2="250" y2="420"/>
        
        <line x1="258" y1="162" x2="258" y2="205"/>
        <line x1="258" y1="220" x2="258" y2="280"/>
        <line x1="258" y1="295" x2="258" y2="360"/>
        <line x1="258" y1="375" x2="258" y2="420"/>
      </g>
    </g>
    
    <!-- Band/hatch detail lines -->
    <g stroke="#1a3a5c" stroke-width="0.8" stroke-linecap="round" opacity="0.5">
      <!-- Top band -->
      <line x1="135" y1="175" x2="135" y2="187"/>
      <line x1="150" y1="175" x2="150" y2="187"/>
      <line x1="165" y1="175" x2="165" y2="187"/>
      <line x1="180" y1="175" x2="180" y2="187"/>
      <line x1="195" y1="175" x2="195" y2="187"/>
      <line x1="210" y1="175" x2="210" y2="187"/>
      <line x1="225" y1="175" x2="225" y2="187"/>
      <line x1="240" y1="175" x2="240" y2="187"/>
      <line x1="255" y1="175" x2="255" y2="187"/>
      <line x1="265" y1="175" x2="265" y2="187"/>
      
      <!-- Middle band -->
      <line x1="135" y1="290" x2="135" y2="302"/>
      <line x1="150" y1="290" x2="150" y2="302"/>
      <line x1="165" y1="290" x2="165" y2="302"/>
      <line x1="180" y1="290" x2="180" y2="302"/>
      <line x1="195" y1="290" x2="195" y2="302"/>
      <line x1="210" y1="290" x2="210" y2="302"/>
      <line x1="225" y1="290" x2="225" y2="302"/>
      <line x1="240" y1="290" x2="240" y2="302"/>
      <line x1="255" y1="290" x2="255" y2="302"/>
      <line x1="265" y1="290" x2="265" y2="302"/>
      
      <!-- Bottom band -->
      <line x1="135" y1="395" x2="135" y2="407"/>
      <line x1="150" y1="395" x2="150" y2="407"/>
      <line x1="165" y1="395" x2="165" y2="407"/>
      <line x1="180" y1="395" x2="180" y2="407"/>
      <line x1="195" y1="395" x2="195" y2="407"/>
      <line x1="210" y1="395" x2="210" y2="407"/>
      <line x1="225" y1="395" x2="225" y2="407"/>
      <line x1="240" y1="395" x2="240" y2="407"/>
      <line x1="255" y1="395" x2="255" y2="407"/>
      <line x1="265" y1="395" x2="265" y2="407"/>
    </g>
    
    <!-- Top bunghole -->
    <ellipse cx="200" cy="140" rx="12" ry="8" fill="#3a3a3a"/>
    <ellipse cx="200" cy="140" rx="8" ry="5" fill="#1a1a1a"/>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.25">
    <line x1="80" y1="440" x2="83" y2="470"/>
    <line x1="120" y1="445" x2="123" y2="478"/>
    <line x1="160" y1="438" x2="163" y2="465"/>
    <line x1="200" y1="442" x2="203" y2="475"/>
    <line x1="240" y1="440" x2="243" y2="468"/>
    <line x1="280" y1="445" x2="283" y2="480"/>
    <line x1="320" y1="438" x2="323" y2="465"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · wooden barrel · contour breaks</text>
</svg>