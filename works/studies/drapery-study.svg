<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="contour" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M0,10 Q10,0 20,10 Q10,20 0,10" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="texture" patternUnits="userSpaceOnUse" width="5" height="5">
      <line x1="0" y1="0" x2="5" y2="5" stroke="#1a1a2e" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  
  <rect width="400" height="600" fill="#f0ebe3"/>
  
  <!-- Drapery / cloth study - flowing folds -->
  <g transform="translate(200, 300)">
    <!-- Main cloth hanging -->
    <path d="M-100,-200 Q-80,-100 -90,0 Q-100,100 -80,200 L-60,200 Q-70,100 -60,0 Q-50,-100 -70,-200 Z" 
          fill="url(#texture)" stroke="#1a1a2e" stroke-width="1.5"/>
    
    <!-- Fold 1 -->
    <path d="M-90,0 Q-40,20 -30,-50 Q-20,-100 -50,-150" fill="url(#contour)" stroke="#1a1a2e" stroke-width="1"/>
    <path d="M-90,0 Q-30,30 -20,-30 Q-10,-80 -40,-130" fill="none" stroke="#1a1a2e" stroke-width="0.8" opacity="0.5"/>
    
    <!-- Fold 2 -->
    <path d="M-60,50 Q-10,80 20,40 Q50,10 40,-50" fill="url(#contour)" stroke="#1a1a2e" stroke-width="1"/>
    
    <!-- Fold 3 -->
    <path d="M-30,100 Q20,150 60,120 Q90,90 80,30" fill="url(#texture)" stroke="#1a1a2e" stroke-width="1"/>
    
    <!-- Bottom edge -->
    <path d="M-80,200 Q0,220 80,200" stroke="#1a1a2e" stroke-width="2"/>
  </g>
  
  <!-- Weight lines -->
  <g stroke="#1a1a2e" stroke-width="0.5" opacity="0.4">
    <line x1="150" y1="280" x2="160" y2="350"/>
    <line x1="170" y1="290" x2="175" y2="360"/>
    <line x1="230" y1="280" x2="240" y2="350"/>
  </g>
  
  <line x1="330" y1="570" x2="380" y2="570" stroke="#1a1a2e" stroke-width="0.8" opacity="0.4"/>
</svg>