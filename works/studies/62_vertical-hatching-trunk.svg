<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.2" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 62: Vertical Hatching</text>
  
  <!-- Subject: Old tree trunk with vertical bark texture -->
  <g filter="url(#grain)">
    <!-- Main trunk form -->
    <path d="M140 100 Q120 200 130 300 Q135 380 150 420 L250 420 Q265 380 270 300 Q280 200 260 100 Z" fill="#e5dcc8"/>
    
    <!-- Vertical hatching for bark texture -->
    <!-- Left side (shadow) - dense contour breaks -->
    <g stroke="#1a3a5c" stroke-width="1.3" stroke-linecap="round">
      <!-- Heavy bark lines with breaks -->
      <line x1="145" y1="110" x2="145" y2="160"/>
      <line x1="145" y1="175" x2="145" y2="230"/>
      <line x1="145" y1="245" x2="145" y2="300"/>
      <line x1="145" y1="315" x2="145" y2="370"/>
      <line x1="145" y1="385" x2="145" y2="415"/>
      
      <line x1="155" y1="110" x2="155" y2="150"/>
      <line x1="155" y1="165" x2="155" y2="220"/>
      <line x1="155" y1="235" x2="155" y2="290"/>
      <line x1="155" y1="305" x2="155" y2="360"/>
      <line x1="155" y1="375" x2="155" y2="415"/>
      
      <line x1="165" y1="110" x2="165" y2="145"/>
      <line x1="165" y1="160" x2="165" y2="210"/>
      <line x1="165" y1="225" x2="165" y2="280"/>
      <line x1="165" y1="295" x2="165" y2="350"/>
      <line x1="165" y1="365" x2="165" y2="415"/>
      
      <!-- Mid-tones -->
      <line x1="175" y1="110" x2="175" y2="155"/>
      <line x1="175" y1="170" x2="175" y2="225"/>
      <line x1="175" y1="240" x2="175" y2="295"/>
      <line x1="175" y1="310" x2="175" y2="365"/>
      <line x1="175" y1="380" x2="175" y2="415"/>
      
      <line x1="185" y1="110" x2="185" y2="165"/>
      <line x1="185" y1="180" x2="185" y2="235"/>
      <line x1="185" y1="250" x2="185" y2="305"/>
      <line x1="185" y1="320" x2="185" y2="375"/>
      <line x1="185" y1="390" x2="185" y2="415"/>
      
      <!-- Right side (lighter) - sparser lines -->
      <line x1="195" y1="115" x2="195" y2="170"/>
      <line x1="195" y1="185" x2="195" y2="240"/>
      <line x1="195" y1="255" x2="195" y2="310"/>
      <line x1="195" y1="325" x2="195" y2="380"/>
      <line x1="195" y1="395" x2="195" y2="415"/>
      
      <line x1="205" y1="115" x2="205" y2="175"/>
      <line x1="205" y1="190" x2="205" y2="250"/>
      <line x1="205" y1="265" x2="205" y2="320"/>
      <line x1="205" y1="335" x2="205" y2="385"/>
      <line x1="205" y1="400" x2="205" y2="415"/>
      
      <line x1="215" y1="120" x2="215" y2="180"/>
      <line x1="215" y1="195" x2="215" y2="255"/>
      <line x1="215" y1="270" x2="215" y2="330"/>
      <line x1="215" y1="345" x2="215" y2="390"/>
      <line x1="215" y1="405" x2="215" y2="415"/>
      
      <!-- Highlight side - thinnest lines -->
      <g stroke-width="0.7" opacity="0.5">
        <line x1="225" y1="125" x2="225" y2="185"/>
        <line x1="225" y1="200" x2="225" y2="265"/>
        <line x1="225" y1="280" x2="225" y2="340"/>
        <line x1="225" y1="355" x2="225" y2="395"/>
        <line x1="225" y1="408" x2="225" y2="415"/>
        
        <line x1="235" y1="130" x2="235" y2="195"/>
        <line x1="235" y1="210" x2="235" y2="275"/>
        <line x1="235" y1="290" x2="235" y2="350"/>
        <line x1="235" y1="365" x2="235" y2="400"/>
        <line x1="235" y1="410" x2="235" y2="415"/>
        
        <line x1="245" y1="135" x2="245" y2="200"/>
        <line x1="245" y1="215" x2="245" y2="285"/>
        <line x1="245" y1="300" x2="245" y2="360"/>
        <line x1="245" y1="375" x2="245" y2="408"/>
      </g>
    </g>
    
    <!-- Bark ridges - horizontal accents -->
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round" opacity="0.6">
      <path d="M135 180 Q180 175 255 185" fill="none"/>
      <path d="M132 260 Q180 255 258 265" fill="none"/>
      <path d="M135 340 Q180 335 260 345" fill="none"/>
    </g>
    
    <!-- Knot detail -->
    <ellipse cx="175" cy="200" rx="15" ry="20" fill="#d5cbb8"/>
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <ellipse cx="175" cy="200" rx="15" ry="20" fill="none"/>
      <!-- Knot rings with contour breaks -->
      <path d="M165 195 Q175 190 185 195" fill="none"/>
      <path d="M162 205 Q175 200 188 205" fill="none"/>
      <path d="M165 215 Q175 210 185 215" fill="none"/>
    </g>
  </g>
  
  <!-- Ground - simple grass hints -->
  <path d="M0 420 Q80 410 150 420 Q220 430 280 418 Q340 408 400 420 L400 500 L0 500 Z" fill="#ddd5c5"/>
  <g stroke="#2a4a6c" stroke-width="0.5" stroke-linecap="round" opacity="0.3">
    <line x1="30" y1="425" x2="35" y2="445"/>
    <line x1="50" y1="422" x2="55" y2="450"/>
    <line x1="75" y1="428" x2="80" y2="455"/>
    <line x1="100" y1="420" x2="105" y2="448"/>
    <line x1="130" y1="425" x2="133" y2="452"/>
    <line x1="160" y1="430" x2="163" y2="458"/>
    <line x1="190" y1="422" x2="195" y2="450"/>
    <line x1="220" y1="428" x2="223" y2="455"/>
    <line x1="250" y1="420" x2="255" y2="448"/>
    <line x1="280" y1="425" x2="283" y2="452"/>
    <line x1="310" y1="430" x2="315" y2="460"/>
    <line x1="340" y1="418" x2="345" y2="445"/>
    <line x1="370" y1="422" x2="373" y2="450"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · bark texture · contour breaks</text>
</svg>