<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f0e6" surfaceScale="1.3" result="diffLight">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Paper background -->
  <rect width="400" height="500" fill="#f5f0e6"/>
  
  <!-- Title -->
  <text x="200" y="35" font-family="Georgia, serif" font-size="16" fill="#1a3a5c" text-anchor="middle" font-style="italic">Study 70: Vertical Hatching</text>
  
  <!-- Subject: Old wooden shed door -->
  <g filter="url(#grain)">
    <!-- Sky -->
    <rect x="0" y="0" width="400" height="150" fill="#e5e0d5"/>
    
    <!-- Ground -->
    <path d="M0 420 Q100 410 200 420 Q300 430 400 415 L400 500 L0 500 Z" fill="#e0d8c8"/>
    
    <!-- Shed wall around door -->
    <rect x="60" y="80" width="280" height="350" fill="#c8bba8"/>
    
    <!-- Door frame -->
    <rect x="110" y="120" width="180" height="300" fill="#b8a890"/>
    
    <!-- Door planks -->
    <rect x="115" y="125" width="25" height="290" fill="#c8b898"/>
    <rect x="143" y="125" width="25" height="290" fill="#c0b090"/>
    <rect x="171" y="125" width="25" height="290" fill="#c8b898"/>
    <rect x="199" y="125" width="25" height="290" fill="#c0b090"/>
    <rect x="227" y="125" width="25" height="290" fill="#c8b898"/>
    <rect x="255" y="125" width="25" height="290" fill="#c0b090"/>
    
    <!-- Vertical hatching on door planks -->
    <g stroke="#1a3a5c" stroke-width="1" stroke-linecap="round">
      <!-- First plank -->
      <line x1="120" y1="135" x2="120" y2="180"/>
      <line x1="120" y1="195" x2="120" y2="260"/>
      <line x1="120" y1="275" x2="120" y2="350"/>
      <line x1="120" y1="365" x2="120" y2="405"/>
      
      <line x1="127" y1="135" x2="127" y2="175"/>
      <line x1="127" y1="190" x2="127" y2="255"/>
      <line x1="127" y1="270" x2="127" y2="340"/>
      <line x1="127" y1="355" x2="127" y2="405"/>
      
      <!-- Second plank -->
      <line x1="148" y1="135" x2="148" y2="180"/>
      <line x1="148" y1="195" x2="148" y2="260"/>
      <line x1="148" y1="275" x2="148" y2="350"/>
      <line x1="148" y1="365" x2="148" y2="405"/>
      
      <line x1="155" y1="135" x2="155" y2="175"/>
      <line x1="155" y1="190" x2="155" y2="255"/>
      <line x1="155" y1="270" x2="155" y2="340"/>
      <line x1="155" y1="355" x2="155" y2="405"/>
      
      <!-- Third plank -->
      <line x1="176" y1="135" x2="176" y2="180"/>
      <line x1="176" y1="195" x2="176" y2="260"/>
      <line x1="176" y1="275" x2="176" y2="350"/>
      <line x1="176" y1="365" x2="176" y2="405"/>
      
      <line x1="183" y1="135" x2="183" y2="175"/>
      <line x1="183" y1="190" x2="183" y2="255"/>
      <line x1="183" y1="270" x2="183" y2="340"/>
      <line x1="183" y1="355" x2="183" y2="405"/>
      
      <!-- Fourth plank -->
      <line x1="204" y1="135" x2="204" y2="180"/>
      <line x1="204" y1="195" x2="204" y2="260"/>
      <line x1="204" y1="275" x2="204" y2="350"/>
      <line x1="204" y1="365" x2="204" y2="405"/>
      
      <line x1="211" y1="135" x2="211" y2="175"/>
      <line x1="211" y1="190" x2="211" y2="255"/>
      <line x1="211" y1="270" x2="211" y2="340"/>
      <line x1="211" y1="355" x2="211" y2="405"/>
      
      <!-- Fifth plank -->
      <line x1="232" y1="135" x2="232" y2="180"/>
      <line x1="232" y1="195" x2="232" y2="260"/>
      <line x1="232" y1="275" x2="232" y2="350"/>
      <line x1="232" y1="365" x2="232" y2="405"/>
      
      <line x1="239" y1="135" x2="239" y2="175"/>
      <line x1="239" y1="190" x2="239" y2="255"/>
      <line x1="239" y1="270" x2="239" y2="340"/>
      <line x1="239" y1="355" x2="239" y2="405"/>
      
      <!-- Sixth plank -->
      <line x1="260" y1="135" x2="260" y2="180"/>
      <line x1="260" y1="195" x2="260" y2="260"/>
      <line x1="260" y1="275" x2="260" y2="350"/>
      <line x1="260" y1="365" x2="260" y2="405"/>
      
      <line x1="267" y1="135" x2="267" y2="175"/>
      <line x1="267" y1="190" x2="267" y2="255"/>
      <line x1="267" y1="270" x2="267" y2="340"/>
      <line x1="267" y1="355" x2="267" y2="405"/>
    </g>
    
    <!-- Door frame border -->
    <rect x="110" y="120" width="180" height="300" fill="none" stroke="#1a3a5c" stroke-width="3"/>
    
    <!-- Horizontal cross brace on door -->
    <rect x="115" y="260" width="170" height="15" fill="#a89880"/>
    <g stroke="#1a3a5c" stroke-width="0.7" stroke-linecap="round">
      <line x1="125" y1="263" x2="125" y2="272"/>
      <line x1="145" y1="263" x2="145" y2="272"/>
      <line x1="165" y1="263" x2="165" y2="272"/>
      <line x1="185" y1="263" x2="185" y2="272"/>
      <line x1="205" y1="263" x2="205" y2="272"/>
      <line x1="225" y1="263" x2="225" y2="272"/>
      <line x1="245" y1="263" x2="245" y2="272"/>
      <line x1="265" y1="263" x2="265" y2="272"/>
    </g>
    
    <!-- Door handle -->
    <circle cx="260" cy="280" r="8" fill="#8a7a60"/>
    <circle cx="260" cy="280" r="5" fill="none" stroke="#1a3a5c" stroke-width="1"/>
    
    <!-- Hinge details -->
    <rect x="110" y="170" width="8" height="20" fill="#6a5a40"/>
    <rect x="110" y="310" width="8" height="20" fill="#6a5a40"/>
    
    <!-- Shed wall texture around door -->
    <g stroke="#1a3a5c" stroke-width="0.6" stroke-linecap="round" opacity="0.4">
      <!-- Left side wall -->
      <line x1="70" y1="100" x2="70" y2="140"/>
      <line x1="70" y1="155" x2="70" y2="200"/>
      <line x1="70" y1="215" x2="70" y2="270"/>
      <line x1="70" y1="285" x2="70" y2="350"/>
      <line x1="70" y1="365" x2="70" y2="420"/>
      
      <line x1="85" y1="100" x2="85" y2="145"/>
      <line x1="85" y1="160" x2="85" y2="210"/>
      <line x1="85" y1="225" x2="85" y2="280"/>
      <line x1="85" y1="295" x2="85" y2="360"/>
      <line x1="85" y1="375" x2="85" y2="420"/>
      
      <!-- Right side wall -->
      <line x1="315" y1="100" x2="315" y2="140"/>
      <line x1="315" y1="155" x2="315" y2="200"/>
      <line x1="315" y1="215" x2="315" y2="270"/>
      <line x1="315" y1="285" x2="315" y2="350"/>
      <line x1="315" y1="365" x2="315" y2="420"/>
      
      <line x1="330" y1="100" x2="330" y2="145"/>
      <line x1="330" y1="160" x2="330" y2="210"/>
      <line x1="330" y1="225" x2="330" y2="280"/>
      <line x1="330" y1="295" x2="330" y2="360"/>
      <line x1="330" y1="375" x2="330" y2="420"/>
    </g>
    
    <!-- Roof overhang suggestion -->
    <rect x="50" y="70" width="300" height="15" fill="#a89880"/>
    <g stroke="#1a3a5c" stroke-width="0.6" stroke-linecap="round">
      <line x1="60" y1="75" x2="60" y2="82"/>
      <line x1="80" y1="75" x2="80" y2="82"/>
      <line x1="100" y1="75" x2="100" y2="82"/>
      <line x1="120" y1="75" x2="120" y2="82"/>
      <line x1="140" y1="75" x2="140" y2="82"/>
      <line x1="160" y1="75" x2="160" y2="82"/>
      <line x1="180" y1="75" x2="180" y2="82"/>
      <line x1="200" y1="75" x2="200" y2="82"/>
      <line x1="220" y1="75" x2="220" y2="82"/>
      <line x1="240" y1="75" x2="240" y2="82"/>
      <line x1="260" y1="75" x2="260" y2="82"/>
      <line x1="280" y1="75" x2="280" y2="82"/>
      <line x1="300" y1="75" x2="300" y2="82"/>
      <line x1="320" y1="75" x2="320" y2="82"/>
      <line x1="340" y1="75" x2="340" y2="82"/>
    </g>
  </g>
  
  <!-- Ground texture -->
  <g stroke="#2a4a6c" stroke-width="0.4" stroke-linecap="round" opacity="0.3">
    <line x1="30" y1="440" x2="33" y2="475"/>
    <line x1="70" y1="445" x2="73" y2="480"/>
    <line x1="110" y1="438" x2="113" y2="470"/>
    <line x1="150" y1="442" x2="153" y2="478"/>
    <line x1="190" y1="440" x2="193" y2="472"/>
    <line x1="230" y1="435" x2="233" y2="468"/>
    <line x1="270" y1="442" x2="273" y2="480"/>
    <line x1="310" y1="438" x2="313" y2="470"/>
    <line x1="350" y1="445" x2="353" y2="478"/>
    <line x1="380" y1="440" x2="383" y2="472"/>
  </g>
  
  <!-- Technique notes -->
  <text x="200" y="465" font-family="Georgia, serif" font-size="11" fill="#4a6a8c" text-anchor="middle">vertical hatching · wooden door · contour breaks</text>
</svg>